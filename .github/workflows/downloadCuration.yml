# .github/workflows/daily-download.yml
name: Daily Curation Backup

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight UTC every day
  workflow_dispatch:       # Also allows manual runs

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download file
        run: |
          npx playwright install chromium --with-deps
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              await page.goto('https://achievement-scouts.com/api/alphaboot/curations.json');
              await page.waitForTimeout(5000);
              const content = await page.content();
              require('fs').writeFileSync('curations.json', content);
              await browser.close();
            })();
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add curations.json
          git diff --cached --quiet || git commit -m "chore: daily file update $(date -u +%Y-%m-%d)"
          git push
